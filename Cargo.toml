[package]
name = "taiko"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-futures = { version = "0.1.0" }
embassy-stm32 = { version = "0.2.0", features = ["stm32f411ce", "time-driver-any"] } #you can specify memory-x, so it will guess that, but I decided not to
embassy-time = { version = "0.4.0", features = ["tick-hz-32_768"] }
embassy-usb = { version = "0.4.0", features = [ ] }

cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"
usbd-hid = "0.8.2"
panic-probe = { version = "1.0.0" }

[profile.release]
debug = 2
opt-level = "s"
lto = "fat"
panic = "abort"
