[package]
name = "taiko"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.7.0", features = ["defmt", "arch-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-futures = { version = "0.1.0", features = ["defmt"] }
embassy-stm32 = { version = "0.2.0", features = ["defmt", "stm32f411ce", "unstable-pac", "memory-x", "time-driver-tim4", "exti", "chrono"] } #you can specify memory-x, so it will guess that, but I decided not to
embassy-time = { version = "0.4.0", features = ["defmt", "tick-hz-32_768"] }
embassy-usb = { version = "0.4.0", features = [ "defmt" ] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
usbd-hid = "0.8.1"

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
